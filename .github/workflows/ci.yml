name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (no model)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-serve.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Every module imports
        run: |
          python - <<'PY'
          import importlib
          mods = ["ml.artifacts", "ml.calibration", "ml.evaluation", "ml.predict",
                  "ml.fetch_model", "api.main", "api.schemas", "api.audit", "api.security"]
          for m in mods:
              importlib.import_module(m)
              print("ok", m)
          PY

      - name: Tests
        run: pytest -m "not model"

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compose file is valid
        run: docker compose config --quiet

      - name: Build
        run: docker build -t avertx-sif:ci .

      - name: Image size and torch-free check
        run: |
          docker image inspect avertx-sif:ci --format 'image size: {{.Size}} bytes'
          docker run --rm avertx-sif:ci python -c "
          import importlib.util, sys
          assert importlib.util.find_spec('onnxruntime'), 'onnxruntime missing'
          assert importlib.util.find_spec('transformers'), 'transformers missing'
          print('torch present:', importlib.util.find_spec('torch') is not None)
          "

      - name: Container serves
        run: |
          docker run -d --name sif -p 8000:8000 avertx-sif:ci
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health | tee /dev/stderr | grep -q '"model_ready":true'
          curl -fsS -X POST http://127.0.0.1:8000/score \
            -H 'Content-Type: application/json' \
            -d '{"narrative":"H2S alarm sounded at the wellhead; two technicians were working without breathing apparatus and one collapsed."}' \
            | tee /dev/stderr | grep -q '"band":"HIGH"'

      - name: Container records site history and assesses it
        run: |
          curl -fsS -X POST http://127.0.0.1:8000/score \
            -H 'Content-Type: application/json' \
            -d '{"narrative":"A scaffold plank moved underfoot as a fitter stepped onto it at 8 metres without his harness clipped.","site_id":"ci-rig"}' \
            | tee /dev/stderr | grep -q '"recorded":true'
          curl -fsS -X POST http://127.0.0.1:8000/score \
            -H 'Content-Type: application/json' \
            -d '{"narrative":"Crew began breaking the flange on the test line before the permit to work had come back signed.","site_id":"ci-rig"}' \
            | tee /dev/stderr | grep -q '"rule_id":"work_authorisation"'
          curl -fsS http://127.0.0.1:8000/sites/ci-rig \
            | tee /dev/stderr | grep -q '"n_observations":2'

      - name: Container serves the dashboard
        run: |
          curl -fsS http://127.0.0.1:8000/dashboard > /tmp/dash.html
          grep -q '<title>' /tmp/dash.html
          grep -q 'unvalidated aggregation policy' /tmp/dash.html

      - name: Healthcheck reports healthy
        run: |
          for i in $(seq 1 30); do
            s=$(docker inspect --format '{{.State.Health.Status}}' sif)
            echo "health: $s"
            [ "$s" = "healthy" ] && exit 0
            [ "$s" = "unhealthy" ] && { docker logs sif; exit 1; }
            sleep 5
          done
          docker logs sif; exit 1

      - name: Container logs are structured JSON
        run: |
          docker logs sif 2>&1 | grep '"event": *"prediction"' | tail -1 > audit.jsonl
          python - <<'PY'
          import json
          r = json.loads(open("audit.jsonl").read())
          assert r["event"] == "prediction"
          for k in ("sif_probability", "threshold", "band", "flagged",
                    "narrative_sha256", "model_fingerprint"):
              assert k in r, f"audit record lost {k}"
          print("audit record OK:", r["band"], r["model_fingerprint"])
          PY

      - name: Stop
        if: always()
        run: docker rm -f sif || true

  integration:
    name: integration (with model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-serve.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Cache model
        id: cache-model
        uses: actions/cache@v6
        with:
          path: model_artifacts
          key: sif-model-v1

      - name: Fetch model
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: python -m ml.fetch_model

      - name: Model is servable
        run: python -m ml.fetch_model --check

      - name: Selftest
        run: python -m ml.selftest

      - name: Tests
        run: pytest

      - name: Service starts and answers
        run: |
          uvicorn api.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health | tee /dev/stderr | grep -q '"model_ready":true'
          curl -fsS -X POST http://127.0.0.1:8000/score \
            -H 'Content-Type: application/json' \
            -d '{"narrative":"While rigging down, the worker stood under a suspended load when the sling parted and the load fell to the deck."}' \
            | tee /dev/stderr | grep -q '"band"'
